services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: festari_api
    env_file:
      - ./server/.env
    ports:
      - "3030:3030"
    depends_on:
      - db

  db:
    image: postgres
    container_name: festari_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=festari_db
      - PGDATA=/var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
